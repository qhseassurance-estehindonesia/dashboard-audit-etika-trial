<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1B4332">
<title>Dashboard Tindak Lanjut Audit ETIKA — Esteh Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --green-dark:#1B4332;
  --green-mid:#2D6A4F;
  --green-soft:#E7F0EA;
  --cream:#F7F5EF;
  --card:#FFFFFF;
  --amber:#C98A3D;
  --amber-soft:#FBF0DD;
  --red:#B3382C;
  --red-soft:#FBE9E6;
  --charcoal:#26261F;
  --gray:#8A8A7E;
  --line:#E7E3D8;
  --radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--charcoal);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}

/* Header */
.topbar{position:sticky;top:0;z-index:20;background:var(--green-dark);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .leaf{height:34px;width:auto;display:block;}
.brand-text .t1{font-weight:700;font-size:16px;line-height:1.1;}
.brand-text .t2{font-size:11.5px;color:#B7D3C4;letter-spacing:.02em;}
.role-toggle{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:4px;}
.role-toggle button{background:transparent;border:none;color:#DDEDE4;padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:600;transition:.15s;}
.role-toggle button.active{background:#fff;color:var(--green-dark);}
.demo-badge{background:var(--amber);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em;}

.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px;}

/* Stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;}
.stat .n{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
.stat .l{font-size:11.5px;color:var(--gray);margin-top:2px;}
.stat.open .n{color:var(--red);}
.stat.review .n{color:var(--amber);}
.stat.done .n{color:var(--green-mid);}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filters select, .filters input[type=text]{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:13.5px;font-family:inherit;color:var(--charcoal);}
.filters input[type=text]{min-width:180px;}
.pill-filter{display:flex;gap:6px;flex-wrap:wrap;}
.pill-filter button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--gray);}
.pill-filter button.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff;}

/* Finding cards */
.list{display:flex;flex-direction:column;gap:10px;}
.finding{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:.12s;}
.finding:hover{border-color:var(--green-mid);}
.f-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.f-id{font-size:11px;color:var(--gray);}
.f-title{font-weight:600;font-size:14.5px;margin:3px 0 5px;}
.f-meta{font-size:12px;color:var(--gray);display:flex;gap:10px;flex-wrap:wrap;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.badge.open{background:var(--red-soft);color:var(--red);}
.badge.review{background:var(--amber-soft);color:var(--amber);}
.badge.done{background:var(--green-soft);color:var(--green-mid);}
.badge.rejected{background:var(--red-soft);color:var(--red);}
.badge.risk-n{background:#E4E1D3;color:var(--charcoal);}
.badge.risk-s{background:var(--amber);color:#fff;}
.badge.risk-c{background:var(--red);color:#fff;}
.badge.risk-vc{background:#5C1008;color:#fff;}

/* stepper (signature element) */
.stepper{display:flex;align-items:center;gap:4px;margin-top:10px;}
.stepper .seg{flex:1;height:3px;background:var(--line);border-radius:2px;}
.stepper .seg.filled{background:var(--green-mid);}
.stepper .dot{width:9px;height:9px;border-radius:50% 50% 50% 0;transform:rotate(45deg);background:var(--line);flex-shrink:0;}
.stepper .dot.filled{background:var(--green-mid);}
.stepper .dot.current{background:var(--amber);}

.empty{text-align:center;padding:50px 20px;color:var(--gray);}
.empty .big{font-size:32px;margin-bottom:8px;}

/* PIC outlet gate */
.gate{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.gate label{font-size:12.5px;color:var(--gray);display:block;margin-bottom:5px;}
.gate input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;width:220px;}
.gate button{background:var(--green-dark);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:600;font-size:13.5px;}
.pin-wrap{position:relative;display:inline-block;}
.pin-wrap input{padding-right:38px;}
.pin-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;padding:4px 6px;font-size:15px;cursor:pointer;color:var(--gray);}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(20,25,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:22px 20px 30px;}
@media(min-width:700px){.overlay{align-items:center;}.modal{border-radius:20px;}}
.modal h2{font-size:18px;margin:0 0 2px;}
.modal .sub{color:var(--gray);font-size:12.5px;margin-bottom:14px;}
.close-x{position:sticky;top:0;float:right;background:var(--cream);border:none;border-radius:50%;width:30px;height:30px;font-size:16px;color:var(--gray);}
.section-label{font-size:11.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;}
.info-grid .k{color:var(--gray);font-size:11.5px;}
.info-grid .v{font-weight:600;}
.desc-box{background:var(--cream);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5;}
.freetext{white-space:pre-wrap;}
.photo-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.photo-row a img, .photo-row .vid{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line);}
.form-field{margin-bottom:12px;}
.form-field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;}
.form-field input[type=text], .form-field input[type=date], .form-field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;}
.form-field textarea{min-height:80px;resize:vertical;}
.file-drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;font-size:12.5px;color:var(--gray);cursor:pointer;}
.file-drop.filled{border-color:var(--green-mid);color:var(--green-mid);background:var(--green-soft);}
.btn-primary{background:var(--green-dark);color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:14px;width:100%;margin-top:6px;}
.btn-primary:disabled{opacity:.5;}
.btn-row{display:flex;gap:8px;margin-top:6px;}
.btn-row button{flex:1;border-radius:10px;padding:12px;font-weight:700;font-size:13.5px;border:none;}
.btn-approve{background:var(--green-mid);color:#fff;}
.btn-reject{background:var(--red-soft);color:var(--red);}
.msg{font-size:12.5px;padding:9px 12px;border-radius:9px;margin-top:8px;}
.msg.err{background:var(--red-soft);color:var(--red);}
.msg.ok{background:var(--green-soft);color:var(--green-mid);}
.loading-text{text-align:center;color:var(--gray);padding:40px;font-size:13px;}
</style>
</head>

function jsonToDate(v){ return v ? String(v).slice(0,10) : ""; }

/**
 * Normalisasi nomor outlet ke 4 digit di sisi dashboard juga — toleran
 * kalau PIC ketik "625" tanpa 0 di depan, tetap ketemu sama data "0625".
 */
function normalizeOutletJS(v){
  const s = String(v||'').trim();
  if(/^\d+$/.test(s)) return s.padStart(4,'0');
  return s;
}

/**
 * Rapetin baris kosong berlebih dari teks yang diketik user (misal enter berkali-kali),
 * maksimal 1 baris kosong di antara paragraf, biar tampilan nggak boros space
 * tapi paragraf yang beneran dipisah tetap kebawa.
 */
function formatText(s){
  if(!s) return s;
  return String(s).replace(/\n{3,}/g, '\n\n').trim();
}

/**
 * Link Google Drive dari file.getUrl() (…/file/d/FILE_ID/view) itu halaman viewer,
 * bukan gambar langsung, jadi <img src="..."> gagal load. Fungsi ini extract FILE_ID
 * dan bikin link thumbnail yang bisa langsung dipakai di <img>. Link asli tetap
 * dipakai buat <a href> supaya klik gambar tetap buka Drive.
 */
function driveThumb(url){
  if(!url) return url;
  const m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(!m) return url;
  return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w500';
}

/**
 * Satu item checklist bisa punya lebih dari 1 foto — disimpan digabung
 * pakai baris baru (\n) di satu sel. Ini pecah jadi galeri thumbnail.
 */
function renderPhotoGallery(urlString){
  if(!urlString) return "";
  const urls = String(urlString).split('\n').map(s=>s.trim()).filter(Boolean);
  if(!urls.length) return "";
  const imgs = urls.map(u=>
    `<a href="${u}" target="_blank"><img src="${driveThumb(u)}" loading="lazy" onerror="this.parentElement.innerHTML='📷 Lihat foto'"></a>`
  ).join("");
  return `<div class="photo-row">${imgs}</div>`;
}

async function loadData(){

    state.loading = false; render(); return;

  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL + "?action=list");
    const json = await res.json();
    state.data = json;
    state.loadError = "";
  }catch(err){
    state.loadError = "Gagal memuat data dari Google Sheets. Cek APPS_SCRIPT_URL & koneksi.";
    state.data = [];
  }
  state.loading = false; render();
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, // avoids CORS preflight on Apps Script
      body: JSON.stringify(payload)
    });
    return await res.json();
  }catch(err){
    return {success:false, error:"Gagal terhubung ke server."};
  }
}

function stats(list){
  const s = {total:list.length, open:0, review:0, done:0, rejected:0, final:0, bandingReview:0, dianulir:0};
  list.forEach(d=>{
    if(d.Status==="Open") s.open++;
    else if(d.Status==="Diperbaiki") s.review++;
    else if(d.Status==="Terverifikasi") s.done++;
    else if(d.Status==="Ditolak") s.rejected++;
    else if(d.Status==="Ditolak_Final") s.final++;
    else if(d.Status==="Menunggu_Banding") s.bandingReview++;
    else if(d.Status==="Dianulir") s.dianulir++;
  });
  return s;
}

function badgeHtml(status){
  const st = STATUS_LABEL[status] || {label:status,cls:"open"};
  return `<span class="badge ${st.cls}">${st.label}</span>`;
}
const RISK_LABEL = {
  N: {label:"N - Normal", cls:"risk-n"},
  S: {label:"S - Serius", cls:"risk-s"},
  C: {label:"C - Kritikal", cls:"risk-c"},
  VC: {label:"VC - Sangat Kritikal", cls:"risk-vc"}
};
function riskBadge(risk){
  const r = RISK_LABEL[risk] || RISK_LABEL.N;
  return `<span class="badge ${r.cls}">${r.label}</span>`;
}
function stepperHtml(status){
  if(status==="Menunggu_Banding" || status==="Dianulir"){
    const label = status==="Dianulir" ? "🏳️ Banding diterima — dianulir" : "🏳️ Menunggu keputusan banding";
    const color = status==="Dianulir" ? "var(--green-mid)" : "var(--amber)";
    return `<div style="font-size:11.5px;color:${color};font-weight:600;margin-top:10px;">${label}</div>`;
  }
  let idx = STEP_ORDER.indexOf(status);
  if(status==="Ditolak") idx = 1; // sits at "Diperbaiki" stage visually, needs redo
  const dots = STEP_ORDER.map((s,i)=>{
    let cls = "";
    if(i < idx) cls = "filled";
    else if(i === idx) cls = status==="Ditolak" ? "" : "current";
    return `<div class="dot ${cls}"></div>`;
  });
  let html = dots[0];
  for(let i=0;i<2;i++){
    html += `<div class="seg ${i<idx?'filled':''}"></div>` + dots[i+1];
  }
  return `<div class="stepper">${html}</div>`;
}

async function verifyPin(target){
  const inputId = target === 'pic' ? 'picPinInput' : 'qhsePinInput';
  const input = document.getElementById(inputId);
  const pin = input ? input.value.trim() : "";
  if(!pin){ state.pinError = "Masukkan PIN/password dulu."; render(); return; }
  state.pinError = "Memeriksa...";
  render();
  const res = await postAction({action:"verify_pin", pin, target});
  if(res.success){
    if(target === 'pic') state.picUnlocked = true; else state.qhseUnlocked = true;
    state.pinError = "";
  } else if(res.message && res.message.indexOf('Unknown action') > -1){
    state.pinError = "Server belum mengenali aksi 'verify_pin' — kemungkinan edit doPost belum ditambahkan/di-deploy ulang. Cek lagi PANDUAN-INTEGRASI.md bagian doPost.";
  } else {
    state.pinError = res.error || "PIN/password salah.";
  }
  render();
}

  let qhseBandingForm = "";

let pendingFotos = [null, null, null];
let pendingVideo = null;

async function handleFotoSlot(input, slot){
  const file = input.files[0];
  if(!file) return;
  const maxSize = 5*1024*1024;
  if(file.size > maxSize){
    alert("Ukuran foto terlalu besar. Maks 5MB.");
    input.value=""; return;
  }
  const base64 = await fileToBase64(file);
  pendingFotos[slot-1] = base64;
  const dropEl = document.getElementById('dropFoto'+slot);
  dropEl.innerHTML = "📷 " + file.name + ` <span onclick="event.stopPropagation();removeFotoSlot(${slot})" style="margin-left:6px;color:var(--red);cursor:pointer;">✕</span>`;
  dropEl.classList.add('filled');
}

function removeFotoSlot(slot){
  pendingFotos[slot-1] = null;
  document.getElementById('f_foto'+slot).value = "";
  const dropEl = document.getElementById('dropFoto'+slot);
  dropEl.textContent = "📷 Foto " + slot;
  dropEl.classList.remove('filled');
}

async function handleFile(input, dropId, icon){
  const file = input.files[0];
  if(!file) return;
  const maxSize = 15*1024*1024;
  if(file.size > maxSize){
    alert("Ukuran file terlalu besar. Maks " + (maxSize/1024/1024) + "MB.");
    input.value=""; return;
  }
  const base64 = await fileToBase64(file);
  pendingVideo = base64;
  const dropEl = document.getElementById(dropId);
  dropEl.innerHTML = icon + " " + file.name + ` <span onclick="event.stopPropagation();removeVideoSlot()" style="margin-left:6px;color:var(--red);cursor:pointer;">✕</span>`;
  dropEl.classList.add('filled');
}

function removeVideoSlot(){
  pendingVideo = null;
  document.getElementById('f_video').value = "";
  const dropEl = document.getElementById('dropVideo');
  dropEl.textContent = "🎥 Ketuk untuk pilih video";
  dropEl.classList.remove('filled');
}

async function submitPerbaikan(id){
  const nama = document.getElementById('f_nama_pic').value.trim();
  const tanggal = document.getElementById('f_tanggal').value;
  const keterangan = document.getElementById('f_keterangan').value.trim();
  const fotos = pendingFotos.filter(Boolean);
  if(!nama || !keterangan || fotos.length===0){
    document.getElementById('formMsgBox').innerHTML = `<div class="msg err">Nama PIC, keterangan, dan minimal 1 foto bukti wajib diisi.</div>`;
    return;
  }
  document.getElementById('formMsgBox').innerHTML = `<div class="msg" style="background:var(--amber-soft);color:var(--amber);">Mengirim data...</div>`;
  const res = await postAction({action:"update_perbaikan", id, nama_pic:nama, tanggal, keterangan, foto_base64_list:fotos, video_base64:pendingVideo});
  if(res.success){
    pendingFotos=[null,null,null]; pendingVideo=null;
    await loadData();
    state.detailId = null;
    render();
  } else {
    document.getElementById('formMsgBox').innerHTML = `<div class="msg err">${res.error||"Gagal mengirim."}</div>`;
  }
}

async function submitVerify(id, approved){
  const nama = document.getElementById('v_nama').value.trim();
  const catatan = document.getElementById('v_catatan').value.trim();
  const fotos = pendingFotos.filter(Boolean);
  if(!nama || !catatan){
    document.getElementById('formMsgBox').innerHTML = `<div class="msg err">Nama verifikator dan catatan wajib diisi.</div>`;
    return;
  }
  if(!approved && fotos.length===0){
    document.getElementById('formMsgBox').innerHTML = `<div class="msg err">Kalau ditolak, minimal 1 foto bukti pendukung wajib diisi.</div>`;
    return;
  }
  document.getElementById('formMsgBox').innerHTML = `<div class="msg" style="background:var(--amber-soft);color:var(--amber);">Menyimpan...</div>`;
  const res = await postAction({action:"verify", id, approved, catatan, verifikator:nama, foto_base64_list:fotos, video_base64:pendingVideo});
  if(res.success){
    pendingFotos=[null,null,null]; pendingVideo=null;
    await loadData();
    state.detailId = null;
    render();
  } else {
    document.getElementById('formMsgBox').innerHTML = `<div class="msg err">${res.error||"Gagal menyimpan."}</div>`;
  }
}

function setPicActionMode(mode){
  state.picActionMode = mode;
  pendingFotos = [null,null,null];
  pendingVideo = null;
  state.formMsg = "";
  render();
}

async function submitBanding(id){
  const nama = document.getElementById('b_nama_pic').value.trim();
  const tanggal = document.getElementById('b_tanggal').value;
  const alasan = document.getElementById('b_alasan').value.trim();

  if(!nama || !alasan || fotos.length===0){
    document.getElementById('formMsgBox').innerHTML = `<div class="msg err">Nama PIC, alasan banding, dan minimal 1 foto bukti wajib diisi.</div>`;

    state.picActionMode = null;
    render();
  } else {
    document.getElementById('formMsgBox').innerHTML = `<div class="msg err">${res.error||"Gagal mengirim banding."}</div>`;
  }
}

  if(res.success){

    render();
  } else {
    document.getElementById('formMsgBox').innerHTML = `<div class="msg err">${res.error||"Gagal menyimpan."}</div>`;
  }

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = `<div class="loading-text">Memuat data audit...</div>`; return; }
  try{
    let html = "";
    if(state.loadError) html += `<div class="msg err" style="margin-bottom:14px;">${state.loadError}</div>`;
    html += state.role==="qhse" ? renderQhse() : renderPic();
    html += detailModal();
    app.innerHTML = html;
  }catch(err){
    console.error('Render error:', err);
    app.innerHTML = `<div class="msg err" style="margin-bottom:14px;">Terjadi kesalahan saat menampilkan data: ${err.message}. Coba refresh halaman.</div>`;
  }
}

document.getElementById('btnRoleQhse').onclick = ()=>{ state.role='qhse'; state.detailId=null; document.getElementById('btnRoleQhse').classList.add('active'); document.getElementById('btnRolePic').classList.remove('active'); render(); };
document.getElementById('btnRolePic').onclick = ()=>{ state.role='pic'; state.detailId=null; document.getElementById('btnRolePic').classList.add('active'); document.getElementById('btnRoleQhse').classList.remove('active'); render(); };

loadData();
</script>
